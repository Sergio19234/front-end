```
<div
  id="status-aplicacao"
  role="status"
  aria-live="polite"
></div>

<section aria-labelledby="titulo-filtros">
  <h2 id="titulo-filtros">Busca e Filtros</h2>

  <form action="#" method="get">

    <p>
      <label for="campo-busca">Buscar por título da tarefa:</label>
      <input
        type="search"
        id="campo-busca"
        name="busca"
      >
    </p>

    <fieldset>
      <legend>Filtrar por Status</legend>

      <p>
        <input
          type="radio"
          id="status-todos"
          name="filtro-status"
          value="todos"
          checked
        >
        <label for="status-todos">Todos</label>
      </p>

      <p>
        <input
          type="radio"
          id="status-a-fazer"
          name="filtro-status"
          value="a-fazer"
        >
        <label for="status-a-fazer">A Fazer</label>
      </p>

      <p>
        <input
          type="radio"
          id="status-em-andamento"
          name="filtro-status"
          value="em-andamento"
        >
        <label for="status-em-andamento">Em Andamento</label>
      </p>

      <p>
        <input
          type="radio"
          id="status-em-revisao"
          name="filtro-status"
          value="em-revisao"
        >
        <label for="status-em-revisao">Em Revisão</label>
      </p>

      <p>
        <input
          type="radio"
          id="status-concluida"
          name="filtro-status"
          value="concluida"
        >
        <label for="status-concluida">Concluída</label>
      </p>
    </fieldset>

    <fieldset>
      <legend>Filtrar por Prioridade</legend>

      <p>
        <input
          type="radio"
          id="prio-todas"
          name="filtro-prioridade"
          value="todas"
          checked
        >
        <label for="prio-todas">Todas</label>
      </p>

      <p>
        <input
          type="radio"
          id="prio-baixa"
          name="filtro-prioridade"
          value="baixa"
        >
        <label for="prio-baixa">Baixa</label>
      </p>

      <p>
        <input
          type="radio"
          id="prio-media"
          name="filtro-prioridade"
          value="media"
        >
        <label for="prio-media">Média</label>
      </p>

      <p>
        <input
          type="radio"
          id="prio-alta"
          name="filtro-prioridade"
          value="alta"
        >
        <label for="prio-alta">Alta</label>
      </p>
    </fieldset>

    <p>
      <button type="submit">Aplicar Filtros</button>
    </p>

  </form>
</section>


<section aria-labelledby="titulo-quadro">

  <h2 id="titulo-quadro">Quadro de Tarefas</h2>


  <section aria-labelledby="status-afazer-heading">

    <h3 id="status-afazer-heading">A Fazer</h3>

    <ul>
    </ul>

  </section>


  <section aria-labelledby="status-andamento-heading">

    <h3 id="status-andamento-heading">Em Andamento</h3>

    <ul>
    </ul>

  </section>


  <section aria-labelledby="status-revisao-heading">

    <h3 id="status-revisao-heading">Em Revisão</h3>

    <ul>
    </ul>

  </section>


  <section aria-labelledby="status-concluida-heading">

    <h3 id="status-concluida-heading">Concluída</h3>

    <ul>
    </ul>

  </section>

</section>
